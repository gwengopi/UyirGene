spring:
  profiles:
    active: dev
  application:
    name: uyirgene-backend
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/UyirGene}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000        # 5 min
      max-lifetime: 1200000       # 20 min
      connection-timeout: 20000   # 20 s
      leak-detection-threshold: 60000  # warn if connection held > 60 s
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
          starttls.required: true
          socketFactory.fallback: false
          ssl.protocols: TLSv1.2
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.uyirgene: INFO
    org.springframework.web: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

google:
  client-id: ${GOOGLE_CLIENT_ID:}

payment:
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:UyirGene}}
  certificate:
    folder: uploads/certificates
    logo-path: static/images/logo.png
  video:
    encryption-key: ${VIDEO_ENCRYPTION_KEY}
  storage:
    root: ${APP_STORAGE_ROOT:uploads}
