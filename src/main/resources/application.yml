spring:
  profiles:
    active: dev
  application:
    name: uyirgene-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/UyirGene
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        ddl-auto: update
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.uyirgene: INFO
    org.springframework.web: INFO

app:
  base-url: http://localhost:8080
  certificate:
    folder: uploads/certificates
    logo-path: static/images/logo.png
  video:
    encryption-key: ${VIDEO_ENCRYPTION_KEY:UyirGene2024SecretKey123456789}
