spring:
  profiles:
    active: dev
  application:
    name: uyirgene-backend
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://localhost:1234/UyirGene
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:lavanyapdb22@gmail.com}
    password: ${MAIL_PASSWORD:krishnar}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
          starttls.required: true
          socketFactory.fallback: false
          ssl.protocols: TLSv1.2
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.uyirgene: INFO
    org.springframework.web: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

google:
  client-id: ${GOOGLE_CLIENT_ID:}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:UyirGene}}
  certificate:
    folder: uploads/certificates
    logo-path: static/images/logo.png
  video:
    encryption-key: ${VIDEO_ENCRYPTION_KEY}
