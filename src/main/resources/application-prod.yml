spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
          starttls.required: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://learn.uyirgene.com}

payment:
  provider: ${PAYMENT_PROVIDER:razorpay}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  mail:
    from: ${MAIL_FROM:noreply@uyirgene.com}
    ses-config-set: ${SES_CONFIG_SET:uyirgene-transactional}
  marketing:
    mail:
      host: ${MARKETING_MAIL_HOST:}
      port: ${MARKETING_MAIL_PORT:587}
      username: ${MARKETING_MAIL_USERNAME:}
      password: ${MARKETING_MAIL_PASSWORD:}

google:
  client-id: ${GOOGLE_CLIENT_ID}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  level:
    com.uyirgene: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  file:
    name: /var/log/uyirgene/application.log
