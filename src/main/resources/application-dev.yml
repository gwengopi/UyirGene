spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:1234/UyirGene}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    validate-on-migrate: false   # dev only — prevents checksum mismatch errors when migrations are tweaked
  mail:
    # =======================================================================
    # SMTP Configuration - defaults to Gmail SMTP
    # Set MAIL_USERNAME and MAIL_PASSWORD env vars (Gmail App Password)
    # Generate app password at: https://myaccount.google.com/apppasswords
    #
    # For MailHog (no auth): set MAIL_HOST=localhost MAIL_PORT=1025
    #   Run: docker run -d -p 1025:1025 -p 8025:8025 mailhog/mailhog
    #   View emails at: http://localhost:8025
    # =======================================================================
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:5174,http://13.232.159.64:5173,http://13.232.159.64:8080

payment:
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-do-not-use-in-production-min-256-bits}
  expiration: 86400000

google:
  client-id: ${GOOGLE_CLIENT_ID:}

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:UyirGene}}
  marketing:
    mail:
      host: ${MARKETING_MAIL_HOST:}
      port: ${MARKETING_MAIL_PORT:587}
      username: ${MARKETING_MAIL_USERNAME:}
      password: ${MARKETING_MAIL_PASSWORD:}
  video:
    encryption-key: ${VIDEO_ENCRYPTION_KEY:dev-only-encryption-key-change-in-prod}

server:
  error:
    include-message: always   # dev only — expose actual exception messages for debugging

logging:
  level:
    com.uyirgene: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
