# ============================================================
# CHANGE THIS: replace learn.uyirgene.com with your subdomain
# ============================================================
# Example subdomains: learn.uyirgene.com / learn.uyirgene.com / www.uyirgene.com

server {
    listen 80;
    server_name learn.uyirgene.com;  # <-- CHANGE THIS

    # Let's Encrypt challenge (must be HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name learn.uyirgene.com;  # <-- CHANGE THIS

    # SSL certificates (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/learn.uyirgene.com/fullchain.pem;  # <-- CHANGE THIS
    ssl_certificate_key /etc/letsencrypt/live/learn.uyirgene.com/privkey.pem;    # <-- CHANGE THIS

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 256;

    # Proxy API requests to backend (internal Docker network)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        # Allow file uploads up to 30 MB (Spring Boot limit is 25 MB per file / 50 MB per request)
        client_max_body_size 30m;
        # Disable response buffering for streaming
        proxy_buffering off;
    }

    # Proxy actuator health (for internal monitoring only — not public)
    location /actuator/ {
        deny all;
    }

    # Serve .mjs files as JavaScript (nginx alpine doesn't include .mjs in default
    # MIME types; without this, X-Content-Type-Options: nosniff causes browsers
    # to refuse loading the PDF.js web worker, breaking certificate preview)
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache Vite-generated assets forever (they have content hash in filename)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache index.html (React app entry point)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Service worker must not be cached
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Sitemap and robots — serve as static files
    location = /sitemap.xml {
        add_header Content-Type application/xml;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # React Router — serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
