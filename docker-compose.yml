version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: uyirgene-db
    environment:
      POSTGRES_DB: UyirGene
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uyirgene-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uyirgene-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: jdbc:postgresql://db:5432/UyirGene
      MAIL_HOST: smtp.mailtrap.io
      MAIL_PORT: 2525
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - uyirgene-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL:-http://13.232.159.64:8080}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: uyirgene-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - uyirgene-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  uyirgene-network:
    driver: bridge
